<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Micro - Secrétaire IA du CS
  </title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 20px;
      background: #f6f7f9;
      color: #202124;
    }

    .card {
      background: white;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 24px;
    }

    h1 {
      margin-top: 0;
    }

    .nom {
      font-size: 24px;
      font-weight: bold;
      margin: 20px 0 10px;
    }

    .phrase {
      padding: 15px;
      background: #fffdf5;
      border: 1px solid #f9ab00;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 18px;
    }

    #etat {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      background: #e8f0fe;
      font-size: 17px;
    }

    .etat-ok {
      background: #e6f4ea !important;
      color: #137333;
    }

    .etat-erreur {
      background: #fce8e6 !important;
      color: #a50e0e;
    }

    .etat-pause {
      background: #fff4e5 !important;
      color: #b06000;
    }

    .petit {
      margin-top: 12px;
      color: #5f6368;
      font-size: 13px;
    }
  </style>

</head>

<body>

<div class="card">

  <h1 id="titre">
    Micro
  </h1>

  <div
    id="participant"
    class="nom"
  ></div>

  <div
    id="phrase"
    class="phrase"
    style="display:none"
  ></div>

  <div id="etat">
    Initialisation...
  </div>

  <div
    id="infoTechnique"
    class="petit"
  ></div>

</div>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const mode =
  params.get('mode')
  || 'identification';

const participantId =
  params.get('participantId')
  || '';

const nom =
  params.get('nom')
  || '';

let flux = null;

let recorder = null;

let morceaux = [];

let mimeTypeCourant = '';

let temporisateurIdentification = null;


/* =====================================================
   INITIALISATION
===================================================== */

window.onload =
  async function() {

    if (
      mode === 'identification'
    ) {

      initialiserModeIdentification();

    } else if (
      mode === 'seance'
    ) {

      initialiserModeSeance();

    } else {

      afficherErreur(
        'Mode microphone inconnu : '
        + mode
      );
    }
  };


function initialiserModeIdentification() {

  document
    .getElementById('titre')
    .textContent =
      'Identification de la voix';

  document
    .getElementById('participant')
    .textContent =
      nom || 'Participant';

  document
    .getElementById('phrase')
    .style.display =
      'block';

  document
    .getElementById('phrase')
    .textContent =
      '« '
      + (nom || 'Participant')
      + ', je participe à la réunion du Conseil syndical. »';

  afficherEtat(
    'Préparation du microphone...'
  );

  demarrerIdentification();
}


function initialiserModeSeance() {

  document
    .getElementById('titre')
    .textContent =
      'Enregistrement de la séance';

  document
    .getElementById('participant')
    .textContent =
      'Réunion du Conseil Syndical';

  document
    .getElementById('phrase')
    .style.display =
      'none';

  afficherEtat(
    'Prêt à enregistrer la séance.'
  );

  /*
   * Important :
   * l'application principale attend ce signal
   * avant d'envoyer DEMARRER_SEANCE_AUDIO.
   */
  envoyerEtat(
    'MICRO_SEANCE_PRET'
  );
}


/* =====================================================
   MICRO
===================================================== */

async function obtenirMicro() {

  if (flux) {
    return flux;
  }

  if (
    !navigator.mediaDevices
    ||
    !navigator.mediaDevices.getUserMedia
  ) {

    throw new Error(
      'Ce navigateur ne permet pas l’accès au microphone.'
    );
  }

  flux =
    await navigator
      .mediaDevices
      .getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });

  return flux;
}


function choisirMimeTypeAudio() {

  const types = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/mp4'
  ];

  for (
    const type
    of types
  ) {

    if (
      typeof MediaRecorder !== 'undefined'
      &&
      MediaRecorder.isTypeSupported(type)
    ) {

      return type;
    }
  }

  return '';
}


function creerRecorder() {

  mimeTypeCourant =
    choisirMimeTypeAudio();

  const options =
    mimeTypeCourant
      ? {
          mimeType:
            mimeTypeCourant
        }
      : {};

  recorder =
    new MediaRecorder(
      flux,
      options
    );

  if (
    recorder.mimeType
  ) {

    mimeTypeCourant =
      recorder.mimeType;
  }

  document
    .getElementById(
      'infoTechnique'
    )
    .textContent =
      'Format audio : '
      + (
        mimeTypeCourant
        || 'format par défaut du navigateur'
      );
}


/* =====================================================
   IDENTIFICATION
===================================================== */

async function demarrerIdentification() {

  try {

    await obtenirMicro();

    morceaux = [];

    creerRecorder();


    recorder.ondataavailable =
      function(event) {

        if (
          event.data
          &&
          event.data.size > 0
        ) {

          morceaux.push(
            event.data
          );
        }
      };


    recorder.onstop =
      function() {

        if (
          temporisateurIdentification
        ) {

          clearTimeout(
            temporisateurIdentification
          );

          temporisateurIdentification =
            null;
        }

        envoyerIdentification();
      };


    recorder.start();


    afficherEtat(
      '● Enregistrement de la voix en cours...'
    );


    /*
     * 5 secondes suffisent
     * pour l'échantillon vocal.
     */
    temporisateurIdentification =
      setTimeout(
        function() {

          if (
            recorder
            &&
            recorder.state === 'recording'
          ) {

            recorder.stop();
          }

        },
        5000
      );

  } catch (erreur) {

    console.error(
      erreur
    );

    afficherErreur(
      'Erreur microphone : '
      + erreur.message
    );
  }
}


function envoyerIdentification() {

  const blob =
    new Blob(
      morceaux,
      {
        type:
          mimeTypeCourant
          || 'audio/webm'
      }
    );


  libererMicro();


  convertirBlobEnBase64(
    blob,
    function(base64) {


      if (
        window.opener
        &&
        !window.opener.closed
      ) {

        window.opener.postMessage(
          {
            type:
              'VOIX_CS_ENREGISTREE',

            participantId:
              participantId,

            nom:
              nom,

            audioBase64:
              base64,

            mimeType:
              blob.type,

            taille:
              blob.size
          },
          '*'
        );


        afficherSucces(
          '✓ Voix enregistrée.'
        );


        setTimeout(
          function() {

            window.close();

          },
          800
        );

      } else {

        afficherErreur(
          'Enregistrement terminé, mais l’application principale est introuvable.'
        );
      }
    }
  );
}


/* =====================================================
   SEANCE
===================================================== */

async function demarrerSeanceAudio() {

  if (
    recorder
    &&
    recorder.state !== 'inactive'
  ) {

    return;
  }

  try {

    await obtenirMicro();

    morceaux = [];

    creerRecorder();


    recorder.ondataavailable =
      function(event) {

        if (
          event.data
          &&
          event.data.size > 0
        ) {

          morceaux.push(
            event.data
          );
        }
      };


    recorder.onstop =
      function() {

        finaliserSeanceAudio();
      };


    /*
     * On demande un morceau toutes les secondes.
     * Pour le moment, ils restent en mémoire dans
     * cette page jusqu'à la fin du test.
     */
    recorder.start(
      1000
    );


    afficherEtat(
      '● Séance en cours d’enregistrement'
    );


    envoyerEtat(
      'AUDIO_SEANCE_DEMARRE'
    );

  } catch (erreur) {

    console.error(
      erreur
    );


    afficherErreur(
      'Erreur microphone : '
      + erreur.message
    );


    envoyerEtat(
      'AUDIO_SEANCE_ERREUR',
      erreur.message
    );
  }
}


function pauseSeanceAudio() {

  if (
    recorder
    &&
    recorder.state === 'recording'
  ) {

    recorder.pause();


    afficherPause(
      '⏸ Enregistrement en pause'
    );


    envoyerEtat(
      'AUDIO_SEANCE_PAUSE'
    );
  }
}


function reprendreSeanceAudio() {

  if (
    recorder
    &&
    recorder.state === 'paused'
  ) {

    recorder.resume();


    afficherEtat(
      '● Séance en cours d’enregistrement'
    );


    envoyerEtat(
      'AUDIO_SEANCE_REPRIS'
    );
  }
}


function terminerSeanceAudio() {

  if (!recorder) {

    envoyerEtat(
      'AUDIO_SEANCE_ERREUR',
      'Aucun enregistrement de séance n’est actif.'
    );

    return;
  }


  if (
    recorder.state === 'recording'
    ||
    recorder.state === 'paused'
  ) {

    afficherEtat(
      'Finalisation de l’enregistrement...'
    );


    recorder.stop();
  }
}


function finaliserSeanceAudio() {

  const blob =
    new Blob(
      morceaux,
      {
        type:
          mimeTypeCourant
          || 'audio/webm'
      }
    );


  libererMicro();


  convertirBlobEnBase64(
    blob,
    function(base64) {


      if (
        window.opener
        &&
        !window.opener.closed
      ) {

        window.opener.postMessage(
          {
            type:
              'AUDIO_SEANCE_TERMINE',

            audioBase64:
              base64,

            mimeType:
              blob.type,

            taille:
              blob.size
          },
          '*'
        );


        afficherSucces(
          '✓ Enregistrement de la séance terminé.'
        );


      } else {

        afficherErreur(
          'Enregistrement terminé, mais l’application principale est introuvable.'
        );
      }
    }
  );
}


/* =====================================================
   COMMANDES DEPUIS L'APPLICATION PRINCIPALE
===================================================== */

window.addEventListener(
  'message',
  function(event) {

    const data =
      event.data;


    if (
      !data
      ||
      !data.type
    ) {

      return;
    }


    switch (
      data.type
    ) {


      case 'DEMARRER_SEANCE_AUDIO':

        demarrerSeanceAudio();

        break;


      case 'PAUSE_SEANCE_AUDIO':

        pauseSeanceAudio();

        break;


      case 'REPRENDRE_SEANCE_AUDIO':

        reprendreSeanceAudio();

        break;


      case 'TERMINER_SEANCE_AUDIO':

        terminerSeanceAudio();

        break;

    }
  }
);


/* =====================================================
   COMMUNICATION AVEC INDEX.HTML
===================================================== */

function envoyerEtat(
  type,
  message
) {

  if (
    window.opener
    &&
    !window.opener.closed
  ) {

    window.opener.postMessage(
      {
        type:
          type,

        message:
          message || ''
      },
      '*'
    );
  }
}


/* =====================================================
   CONVERSION AUDIO
===================================================== */

function convertirBlobEnBase64(
  blob,
  callback
) {

  const lecteur =
    new FileReader();


  lecteur.onloadend =
    function() {

      const contenu =
        String(
          lecteur.result
        );


      const positionVirgule =
        contenu.indexOf(
          ','
        );


      const base64 =

        positionVirgule >= 0

        ? contenu.substring(
            positionVirgule + 1
          )

        : contenu;


      callback(
        base64
      );
    };


  lecteur.onerror =
    function() {

      afficherErreur(
        'Impossible de convertir l’enregistrement audio.'
      );
    };


  lecteur.readAsDataURL(
    blob
  );
}


/* =====================================================
   LIBÉRATION DU MICROPHONE
===================================================== */

function libererMicro() {

  if (flux) {

    flux
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    flux =
      null;
  }
}


/* =====================================================
   AFFICHAGE
===================================================== */

function afficherEtat(
  texte
) {

  const zone =
    document.getElementById(
      'etat'
    );


  zone.className =
    '';


  zone.textContent =
    texte;
}


function afficherSucces(
  texte
) {

  const zone =
    document.getElementById(
      'etat'
    );


  zone.className =
    'etat-ok';


  zone.textContent =
    texte;
}


function afficherErreur(
  texte
) {

  const zone =
    document.getElementById(
      'etat'
    );


  zone.className =
    'etat-erreur';


  zone.textContent =
    texte;
}


function afficherPause(
  texte
) {

  const zone =
    document.getElementById(
      'etat'
    );


  zone.className =
    'etat-pause';


  zone.textContent =
    texte;
}


/* =====================================================
   SÉCURITÉ FERMETURE
===================================================== */

window.addEventListener(
  'beforeunload',
  function() {

    if (
      recorder
      &&
      (
        recorder.state === 'recording'
        ||
        recorder.state === 'paused'
      )
    ) {

      try {

        recorder.stop();

      } catch (e) {

        console.error(
          e
        );
      }
    }


    libererMicro();
  }
);

</script>

</body>

</html>
