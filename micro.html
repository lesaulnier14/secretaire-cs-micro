<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Micro - Secrétaire IA du CS
  </title>

  <style>

    body {
      font-family:
        Arial,
        sans-serif;

      max-width: 700px;

      margin:
        40px auto;

      padding: 20px;

      background:
        #f6f7f9;

      color:
        #202124;
    }

    .card {
      background:
        white;

      border:
        1px solid #dadce0;

      border-radius:
        12px;

      padding:
        24px;
    }

    button {
      border:
        none;

      border-radius:
        8px;

      padding:
        13px 18px;

      margin-right:
        8px;

      font-size:
        16px;

      font-weight:
        bold;

      cursor:
        pointer;
    }

    #btnDemarrer {
      background:
        #188038;

      color:
        white;
    }

    #btnArreter {
      background:
        #d93025;

      color:
        white;
    }

    button:disabled {
      opacity:
        .4;

      cursor:
        not-allowed;
    }

    #etat {
      margin:
        20px 0;

      padding:
        12px;

      border-radius:
        8px;

      background:
        #e8f0fe;
    }

    #participant {
      font-size:
        24px;

      font-weight:
        bold;

      margin:
        20px 0 10px;
    }

    #phrase {
      padding:
        15px;

      background:
        #fffdf5;

      border:
        1px solid #f9ab00;

      border-radius:
        8px;

      margin-bottom:
        20px;
    }

  </style>

</head>


<body>


<div class="card">


  <h1>
    Identification de la voix
  </h1>


  <div id="participant"></div>


  <div id="phrase"></div>


  <button
    id="btnDemarrer"
    onclick="demarrer()"
  >
    🎙 Enregistrer la voix
  </button>


  <button
    id="btnArreter"
    onclick="arreter()"
    disabled
  >
    ■ Arrêter
  </button>


  <div id="etat">
    Micro prêt.
  </div>


</div>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const participantId =
  params.get(
    'participantId'
  )
  || '';

const nom =
  params.get(
    'nom'
  )
  || 'Participant';


document
  .getElementById(
    'participant'
  )
  .textContent =
    nom;


document
  .getElementById(
    'phrase'
  )
  .textContent =
    '« '
    + nom
    + ', je participe à la réunion du Conseil syndical. »';


let flux =
  null;

let recorder =
  null;

let morceaux =
  [];


async function demarrer() {

  const etat =
    document.getElementById(
      'etat'
    );

  try {

    flux =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio: true
        });

    morceaux =
      [];


    recorder =
      new MediaRecorder(
        flux
      );


    recorder.ondataavailable =
      function(event) {

        if (
          event.data
          &&
          event.data.size > 0
        ) {

          morceaux.push(
            event.data
          );
        }
      };


    recorder.onstop =
      envoyerVersApplication;


    recorder.start();


    document
      .getElementById(
        'btnDemarrer'
      )
      .disabled =
        true;


    document
      .getElementById(
        'btnArreter'
      )
      .disabled =
        false;


    etat.textContent =
      '● Enregistrement en cours...';


    /*
     * Arrêt automatique
     * après 5 secondes.
     */
    setTimeout(
      function() {

        if (
          recorder
          &&
          recorder.state
          === 'recording'
        ) {

          recorder.stop();
        }

      },
      5000
    );


  } catch (erreur) {

    console.error(
      erreur
    );

    etat.textContent =
      'Erreur microphone : '
      + erreur.message;
  }
}


function arreter() {

  if (
    recorder
    &&
    recorder.state
    === 'recording'
  ) {

    recorder.stop();
  }
}


function envoyerVersApplication() {

  const mimeType =
    recorder.mimeType
    || 'audio/webm';


  const blob =
    new Blob(
      morceaux,
      {
        type:
          mimeType
      }
    );


  if (flux) {

    flux
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    flux =
      null;
  }


  document
    .getElementById(
      'etat'
    )
    .textContent =
      'Enregistrement terminé. Transmission à l’application...';


  const lecteur =
    new FileReader();


  lecteur.onloadend =
    function() {

      /*
       * data:audio/webm;base64,AAAA...
       */
      const contenu =
        String(
          lecteur.result
        );

      const base64 =
        contenu.includes(',')
        ? contenu.split(',')[1]
        : contenu;


      if (
        window.opener
        &&
        !window.opener.closed
      ) {

        window.opener.postMessage(
          {
            type:
              'VOIX_CS_ENREGISTREE',

            participantId:
              participantId,

            nom:
              nom,

            audioBase64:
              base64,

            mimeType:
              mimeType
          },
          '*'
        );


        document
          .getElementById(
            'etat'
          )
          .textContent =
            '✓ Voix enregistrée.';


        setTimeout(
          function() {

            window.close();

          },
          800
        );


      } else {

        document
          .getElementById(
            'etat'
          )
          .textContent =
            'Enregistrement terminé, mais l’application principale est introuvable.';
      }
    };


  lecteur.readAsDataURL(
    blob
  );
}

</script>


</body>

</html>
