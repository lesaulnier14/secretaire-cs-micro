<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Micro - Secrétaire IA du CS
  </title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f6f7f9;
      color: #202124;
    }

    .card {
      background: white;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 24px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 13px 18px;
      margin-right: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #etat {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      background: #e8f0fe;
    }

    .nom {
      font-size: 24px;
      font-weight: bold;
      margin: 20px 0 10px;
    }

    .phrase {
      padding: 15px;
      background: #fffdf5;
      border: 1px solid #f9ab00;
      border-radius: 8px;
      margin-bottom: 20px;
    }
  </style>

</head>

<body>

<div class="card">

  <h1 id="titre">
    Micro
  </h1>

  <div
    id="participant"
    class="nom"
  ></div>

  <div
    id="phrase"
    class="phrase"
    style="display:none"
  ></div>

  <div id="etat">
    Initialisation...
  </div>

</div>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );

const mode =
  params.get('mode')
  || 'identification';

const participantId =
  params.get('participantId')
  || '';

const nom =
  params.get('nom')
  || '';

let flux = null;
let recorder = null;
let morceaux = [];

let audioFinal = null;


/* =====================================================
   INITIALISATION
===================================================== */

window.onload =
  async function() {

    if (
      mode === 'identification'
    ) {

      document
        .getElementById('titre')
        .textContent =
          'Identification de la voix';

      document
        .getElementById('participant')
        .textContent =
          nom || 'Participant';

      document
        .getElementById('phrase')
        .style.display =
          'block';

      document
        .getElementById('phrase')
        .textContent =
          '« '
          + (nom || 'Participant')
          + ', je participe à la réunion du Conseil syndical. »';

      await demarrerIdentification();

    } else {

      document
        .getElementById('titre')
        .textContent =
          'Enregistrement de la séance';

      document
        .getElementById('participant')
        .textContent =
          'Réunion du Conseil Syndical';

      document
        .getElementById('etat')
        .textContent =
          'Prêt à enregistrer la séance.';

      /*
       * On ne démarre pas tout seul.
       * On attend une commande de l'application principale.
       */
    }
  };


/* =====================================================
   MICRO
===================================================== */

async function obtenirMicro() {

  if (flux) {
    return;
  }

  flux =
    await navigator
      .mediaDevices
      .getUserMedia({
        audio: true
      });
}


/* =====================================================
   IDENTIFICATION
===================================================== */

async function demarrerIdentification() {

  try {

    await obtenirMicro();

    morceaux = [];

    recorder =
      new MediaRecorder(
        flux
      );

    recorder.ondataavailable =
      function(event) {

        if (
          event.data
          &&
          event.data.size > 0
        ) {

          morceaux.push(
            event.data
          );
        }
      };

    recorder.onstop =
      function() {

        envoyerIdentification();
      };

    recorder.start();

    document
      .getElementById('etat')
      .textContent =
        '● Enregistrement en cours...';

    setTimeout(
      function() {

        if (
          recorder
          &&
          recorder.state
          === 'recording'
        ) {

          recorder.stop();
        }

      },
      5000
    );

  } catch (erreur) {

    document
      .getElementById('etat')
      .textContent =
        'Erreur microphone : '
        + erreur.message;
  }
}


function envoyerIdentification() {

  const mimeType =
    recorder.mimeType
    || 'audio/webm';

  const blob =
    new Blob(
      morceaux,
      {
        type: mimeType
      }
    );

  libererMicro();

  convertirBlobEnBase64(
    blob,
    function(base64) {

      if (
        window.opener
        &&
        !window.opener.closed
      ) {

        window.opener.postMessage(
          {
            type:
              'VOIX_CS_ENREGISTREE',

            participantId:
              participantId,

            nom:
              nom,

            audioBase64:
              base64,

            mimeType:
              mimeType
          },
          '*'
        );

        document
          .getElementById('etat')
          .textContent =
            '✓ Voix enregistrée.';

        setTimeout(
          function() {

            window.close();

          },
          700
        );

      } else {

        document
          .getElementById('etat')
          .textContent =
            'Application principale introuvable.';
      }
    }
  );
}


/* =====================================================
   SEANCE
===================================================== */

async function demarrerSeanceAudio() {

  try {

    await obtenirMicro();

    morceaux = [];

    recorder =
      new MediaRecorder(
        flux
      );

    recorder.ondataavailable =
      function(event) {

        if (
          event.data
          &&
          event.data.size > 0
        ) {

          morceaux.push(
            event.data
          );
        }
      };

    recorder.onstop =
      function() {

        finaliserSeanceAudio();
      };

    recorder.start(1000);

    document
      .getElementById('etat')
      .textContent =
        '● Séance en cours d’enregistrement';

    envoyerEtat(
      'AUDIO_SEANCE_DEMARRE'
    );

  } catch (erreur) {

    document
      .getElementById('etat')
      .textContent =
        'Erreur microphone : '
        + erreur.message;

    envoyerEtat(
      'AUDIO_SEANCE_ERREUR',
      erreur.message
    );
  }
}


function pauseSeanceAudio() {

  if (
    recorder
    &&
    recorder.state
    === 'recording'
  ) {

    recorder.pause();

    document
      .getElementById('etat')
      .textContent =
        '⏸ Enregistrement en pause';

    envoyerEtat(
      'AUDIO_SEANCE_PAUSE'
    );
  }
}


function reprendreSeanceAudio() {

  if (
    recorder
    &&
    recorder.state
    === 'paused'
  ) {

    recorder.resume();

    document
      .getElementById('etat')
      .textContent =
        '● Séance en cours d’enregistrement';

    envoyerEtat(
      'AUDIO_SEANCE_REPRIS'
    );
  }
}


function terminerSeanceAudio() {

  if (
    !recorder
  ) {
    return;
  }

  if (
    recorder.state === 'recording'
    ||
    recorder.state === 'paused'
  ) {

    recorder.stop();

    document
      .getElementById('etat')
      .textContent =
        'Finalisation de l’enregistrement...';
  }
}


function finaliserSeanceAudio() {

  const mimeType =
    recorder.mimeType
    || 'audio/webm';

  const blob =
    new Blob(
      morceaux,
      {
        type: mimeType
      }
    );

  audioFinal =
    blob;

  libererMicro();

  convertirBlobEnBase64(
    blob,
    function(base64) {

      if (
        window.opener
        &&
        !window.opener.closed
      ) {

        window.opener.postMessage(
          {
            type:
              'AUDIO_SEANCE_TERMINE',

            audioBase64:
              base64,

            mimeType:
              mimeType,

            taille:
              blob.size
          },
          '*'
        );

        document
          .getElementById('etat')
          .textContent =
            '✓ Enregistrement de la séance terminé.';

      } else {

        document
          .getElementById('etat')
          .textContent =
            'Application principale introuvable.';
      }
    }
  );
}


/* =====================================================
   COMMANDES DEPUIS L'APPLICATION
===================================================== */

window.addEventListener(
  'message',
  function(event) {

    const data =
      event.data;

    if (
      !data
      ||
      !data.type
    ) {
      return;
    }

    switch (
      data.type
    ) {

      case 'DEMARRER_SEANCE_AUDIO':

        demarrerSeanceAudio();

        break;


      case 'PAUSE_SEANCE_AUDIO':

        pauseSeanceAudio();

        break;


      case 'REPRENDRE_SEANCE_AUDIO':

        reprendreSeanceAudio();

        break;


      case 'TERMINER_SEANCE_AUDIO':

        terminerSeanceAudio();

        break;
    }
  }
);


/* =====================================================
   OUTILS
===================================================== */

function envoyerEtat(
  type,
  message
) {

  if (
    window.opener
    &&
    !window.opener.closed
  ) {

    window.opener.postMessage(
      {
        type: type,
        message:
          message || ''
      },
      '*'
    );
  }
}


function convertirBlobEnBase64(
  blob,
  callback
) {

  const lecteur =
    new FileReader();

  lecteur.onloadend =
    function() {

      const contenu =
        String(
          lecteur.result
        );

      const base64 =
        contenu.includes(',')
        ? contenu.split(',')[1]
        : contenu;

      callback(
        base64
      );
    };

  lecteur.readAsDataURL(
    blob
  );
}


function libererMicro() {

  if (flux) {

    flux
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

    flux =
      null;
  }
}

</script>

</body>

</html>
